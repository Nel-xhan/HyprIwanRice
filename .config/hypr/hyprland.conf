#Hyprland Config#


#Window Rules


# Screen brightness
bind = , XF86MonBrightnessUp, exec, brightnessctl -s +5%
bind = , XF86MonBrightnessDown, exec, brightnessctl -s 5%-


# Keyboard backlight
bind = SUPER, F3, exec, brightnessctl -d *::kbd_backlight set +33%
bind = SUPER, F2, exec, brightnessctl -d *::kbd_backlight set 33%-
 

# League stuff
#
#
# Riot Client
windowrulev2 = nomaxsize, class:^(riotclientux\.exe)$,title:^(Riot\sClient\sMain)$
windowrulev2 = float, class:^(riotclientux\.exe)$,title:^(Riot\sClient\sMain)$
windowrulev2 = size 1530 850, class:^(riotclientux\.exe)$,title:^(Riot\sClient\sMain)$
windowrulev2 = opacity 1.0 override 1.0 override, class:^(riotclientux\.exe)$,title:^(Riot\sClient\sMain)$
# "center" doesnt seem to properly work on this client
windowrulev2 = move -200 -100, class:^(riotclientux\.exe)$,title:^(Riot\sClient\sMain)$

# League Clientsudo touch wg-client.conf
windowrulev2 = nomaxsize, class:^(leagueclientux\.exe)$,title:^(League\sof\sLegends)$
windowrulev2 = float, class:^(leagueclientux\.exe)$,title:^(League\sof\sLegends)$
windowrulev2 = size 1280 720,class:^(leagueclientux\.exe)$,title:^(League\sof\sLegends)$
windowrulev2 = center, class:^(leagueclientux\.exe)$,title:^(League\sof\sLegends)$
windowrulev2 = opacity 1.0 override 1.0 override, class:^(leagueclientux\.exe)$,title:^(League\sof\sLegends)$

# Game Client
windowrulev2 = opacity 1.0 override 1.0 override, class:^(league\sof\slegends\.exe)$,title:^(League\sof\sLegends\s\(TM\)\sClient)$
windowrulev2 = float,  class:^(league\sof\slegends\.exe)$,title:^(League\sof\sLegends\s\(TM\)\sClient)$
windowrulev2 = size 1680 1050, class:^(league\sof\slegends\.exe)$,title:^(League\sof\sLegends\s\(TM\)\sClient)$



#Monitor Settings

# unscale XWayland
xwayland {
  force_zero_scaling = true
}

monitor=eDP-1,1920x1080@240,0x0,1,bitdepth,10
monitor=HDMI-A-1,1680x1050@60,1920x0,1,bitdepth,10
#monitor=HDMI-A-1,2560x1440@60,1920x0,1,bitdepth,10
#monitor=DP-1,1920x1200@60,-1920x-120,1,bitdepth,10
workspace=1, monitor:eDP-1
workspace=2, monitor:HDMI-A-1
#workspace=DP-1,2


#Autostart

exec-once = nm-applet --indicator
exec-once = blueman-applet
exec-once = dunst
exec-once = waybar 
exec-once = /usr/lib/polkit-kde-authentication-agent-1
#exec-once = pypr 


#Environment Variables 

env = XCURSOR_SIZE,24
env = LIBVA_DRIVER_NAME,nvidia
env = XDG_SESSION_TYPE,wayland
env = GBM_BACKEND,nvidia-drm
env = __GLX_VENDOR_LIBRARY_NAME=nvidia
env = WLR_NO_HARDWARE_CURSORS,1
env = VKD3D_CONFIG=dxr
env = PROTON_ENABLE_NVAPI=1
env = PROTON_ENABLE_NGX_UPDATER=1
env = QT_QPA_PLATFORMTHEME,qt5ct
env = QT_WAYLAND_DISABLE_WINDOWDECORATION,1
env = QT_AUTO_SCREEN_SCALE_FACTOR,1
env = ENABLE_VKBASALT=1
env = __NV_PRIME_RENDER_OFFLOAD,1
env = __VK_LAYER_NV_optimus,NVIDIA_only
env = WAYLAND_DISPLAY=wayland-0
env = XDG_CURRENT_DESKTOP,Hyprland
env = XDG_SESSION_DESKTOP,Hyprland
env = SDL_VIDEODRIVER,wayland
#env = SDL_VIDEODRIVER=x11
env = QT_QPA_PLATFORM,wayland
env = __GL_GSYNC_ALLOWED,0
env = __GL_VRR_ALLOWED,0
env = NVreg_EnableGpuFirmware,1

# For all categories, see https://wiki.hyprland.org/Configuring/Variables/
input {
    kb_layout = de
    kb_variant =
    kb_model =
    kb_options =
    kb_rules =
    follow_mouse = 1
    sensitivity = 0.0
    accel_profile = flat



    touchpad {
        natural_scroll = no
    }

    sensitivity = 0 # -1.0 - 1.0, 0 means no modification.
}

general {
    # See https://wiki.hyprland.org/Configuring/Variables/ for more

    gaps_in = 2 #5
    gaps_out = 5 #20
    border_size = 0 #2
    col.active_border = rgba(33ccffee) rgba(00ff99ee) 45deg
    col.inactive_border = rgba(595959aa)

    layout = dwindle
}

decoration {
    # See https://wiki.hyprland.org/Configuring/Variables/ for more

    rounding = 10
    
    blur {
        enabled = true
        size = 3
        passes = 1
    }

    drop_shadow = yes
    shadow_range = 4
    shadow_render_power = 3
    col.shadow = rgba(1a1a1aee)
}

animations {
    enabled = yes

    # Some default animations, see https://wiki.hyprland.org/Configuring/Animations/ for more

    bezier = myBezier, 0.05, 0.9, 0.1, 1.05

    animation = windows, 1, 7, myBezier
    animation = windowsOut, 1, 7, default, popin 80%
    animation = border, 1, 10, default
    animation = borderangle, 1, 8, default
    animation = fade, 1, 7, default
    animation = workspaces, 1, 6, default
}

dwindle {
    # See https://wiki.hyprland.org/Configuring/Dwindle-Layout/ for more
    pseudotile = yes # master switch for pseudotiling. Enabling is bound to mainMod + P in the keybinds section below
    preserve_split = yes # you probably want this
}

master {
    # See https://wiki.hyprland.org/Configuring/Master-Layout/ for more
    #new_is_master = true
}

gestures {
    # See https://wiki.hyprland.org/Configuring/Variables/ for more
    #workspace_swipe = off
}

misc {
	force_default_wallpaper = 2
}
